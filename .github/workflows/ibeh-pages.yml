name: Deploy IBEH to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/ibeh/**"
      - ".github/workflows/ibeh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ibeh-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload IBEH
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public/ibeh

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
