<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sign up — IBEH</title><link rel="stylesheet" href="../assets/styles.css"></head><body>
<div class="auth-shell"><aside class="auth-side"><a class="logo" href="../" style="color:white"><span class="mark"></span>IBEH</a><div><div class="eyebrow" style="color:#c7d0cd;border-color:#41494b"><span class="dot"></span> Early access</div><h1 style="font-size:48px">Costruisci il tuo radar.</h1><p>Configura interessi, tecnologie e priorità dello studio. IBEH ordinerà i segnali in base al contesto.</p></div><span class="mono" style="font-size:10px;color:#829093">PARTIDEA SRL / PRIVATE BETA</span></aside>
<main class="auth-panel"><div class="auth-box"><a class="logo" href="../" style="margin-bottom:26px"><span class="mark"></span>IBEH</a><div class="eyebrow">ACCESS / SIGN UP</div><h2>Crea il tuo account.</h2><div class="sub">Crea il tuo accesso personale a IBEH.</div><form onsubmit="return IBEHAuth.signUp(event)"><div class="field"><label>Nome</label><input id="signup-name" class="input" required autocomplete="name"></div><div class="field"><label>Email</label><input id="signup-email" class="input" type="email" placeholder="nome@studio.it" required autocomplete="email"></div><div class="field"><label>Tipo di studio</label><select id="signup-practice-type" class="input"><option>Studio dentistico</option><option>Poliambulatorio</option><option>Professionista</option><option>Azienda / Fornitore</option></select></div><div class="field"><label>Password</label><input id="signup-password" class="input" type="password" minlength="8" required autocomplete="new-password"></div><label class="consent-row"><input id="signup-marketing" type="checkbox"><span>Voglio ricevere aggiornamenti e contenuti IBEH. Facoltativo.</span></label><button id="auth-submit" class="btn primary full" type="submit">CREA ACCOUNT</button><div id="auth-status" class="auth-status" style="display:none"></div></form><div class="auth-foot">Hai già un account? <a href="../login/"><b>Sign in</b></a></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="../assets/supabase.js"></script><script src="../assets/site.js"></script></body></html>
