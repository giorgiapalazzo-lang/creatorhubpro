<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlfaDocs Radar MVP</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f4f7f9;color:#142733}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{background:#0c2938;color:white;padding:18px}.brand{font-size:20px;font-weight:900;margin-bottom:18px}.brand span{color:#c7ff36}.nav button{display:block;width:100%;padding:9px;border:0;border-radius:9px;background:transparent;color:#c9d8de;text-align:left;cursor:pointer}.nav button.on,.nav button:hover{background:#173f52;color:white}.main{padding:24px;max-width:1400px}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:18px}.top h1{margin:0}.live{background:#e5f7f3;color:#087a68;padding:6px 9px;border-radius:99px;height:max-content}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,1fr)}.card,.row{background:white;border:1px solid #dce6eb;border-radius:14px;padding:15px}.kpi b{font-size:28px;display:block}.muted{color:#687b86}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 0 9px}.section h2{margin:0;font-size:18px}.btn{border:1px solid #dce6eb;background:white;border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer}.primary{background:#00a6a0;color:white;border-color:#00a6a0}.dark{background:#102a43;color:white;border-color:#102a43}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.badge{font-size:11px;font-weight:800;background:#edf3f5;padding:4px 7px;border-radius:99px}.good{background:#e8f8f3;color:#087a68}.red{background:#fff0f2;color:#b52d44}.products{grid-template-columns:repeat(3,1fr)}.product h3{margin:6px 0}.price{font-size:23px;font-weight:900}.small{font-size:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.input,textarea{border:1px solid #dce6eb;border-radius:9px;padding:9px;background:white}.input{min-width:170px}textarea{width:100%;min-height:145px}.compare{display:grid;grid-template-columns:140px repeat(3,minmax(190px,1fr));overflow:auto;background:white;border:1px solid #dce6eb;border-radius:12px}.compare div{padding:10px;border-right:1px solid #dce6eb;border-bottom:1px solid #dce6eb}.label{font-weight:800;background:#f8fafb}.radar{display:grid;grid-template-columns:1fr 160px;gap:12px}.score{background:#102a43;color:white;border-radius:12px;text-align:center;padding:12px}.score b{font-size:36px}.sig{font-size:11px;padding:4px 6px;background:#eef3f5;border-radius:6px;margin:2px;display:inline-block}.ask{display:grid;grid-template-columns:1fr 300px;gap:12px}.msg{max-width:82%;background:#eef3f5;border-radius:12px;padding:10px;margin:8px 0}.me{margin-left:auto;background:#102a43;color:white}table{width:100%;border-collapse:collapse;background:white}th,td{padding:9px;border-bottom:1px solid #dce6eb;text-align:left}.toast{position:fixed;right:20px;bottom:20px;background:#102a43;color:white;padding:10px 13px;border-radius:10px;display:none}@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:relative}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.kpis,.products{grid-template-columns:1fr 1fr}.ask{grid-template-columns:1fr}}@media(max-width:550px){.kpis,.products,.radar{grid-template-columns:1fr}.main{padding:14px}.top{flex-direction:column}}
</style></head><body><div class="app"><aside class="side"><div class="brand">AlfaDocs <span>Radar</span></div><div class="nav" id="nav"></div></aside><main class="main"><div id="view"></div><p class="muted small">MVP: verificare la fonte primaria prima di decisioni cliniche, legali o finanziarie.</p></main></div><div class="toast" id="toast"></div><script>
const P=[['i900','Medit i900','Medit','Scanner intraorale',14900,11900,16900,18400,88],['i700','Medit i700','Medit','Scanner intraorale',7900,6200,9800,10300,85],['trios5','3Shape TRIOS 5','3Shape','Scanner intraorale',21900,18500,25900,29400,91],['itero','iTero Lumina','Align','Scanner intraorale',28900,24900,32900,38200,86],['aoral','Aoralscan 3','SHINING 3D','Scanner intraorale',6200,4800,7900,8100,80],['form4b','Form 4B','Formlabs','Stampa 3D dentale',6499,5990,7490,14900,89],['viso','Planmeca Viso','Planmeca','CBCT',72000,60000,90000,98000,87],['primemill','CEREC Primemill','Dentsply Sirona','Fresatore chairside',49000,42000,58000,74000,88]].map(x=>({id:x[0],name:x[1],brand:x[2],cat:x[3],p:x[4],lo:x[5],hi:x[6],tco:x[7],score:x[8]}));
const G=[['ENPAM — Prestito d’onore primo studio','fino a €120.000',92,'avvio studio · attrezzature','https://www.enpam.it/comefareper/accedere-al-credito-agevolato/prestito-donore/'],['ON — Oltre Nuove imprese a tasso zero','secondo requisiti',70,'nuova impresa · investimenti','https://www.invitalia.it/cosa-facciamo/rafforziamo-le-imprese/nuove-imprese-a-tasso-zero'],['Bandi regionali digitalizzazione/investimenti','variabile',64,'software · attrezzature · digitalizzazione','https://www.incentivi.gov.it/']].map(x=>({t:x[0],a:x[1],f:x[2],tags:x[3],url:x[4]}));
const E=[['Expodental Meeting','annuale','Rimini','https://www.expodental.it/'],['AEEDC Dubai','annuale','Dubai','https://aeedc.com/'],['IDS Cologne','biennale','Colonia','https://www.english.ids-cologne.de/'],['FNOMCeO FAD / eventi','continuo','Online / Italia','https://portale.fnomceo.it/']].map(x=>({t:x[0],d:x[1],p:x[2],url:x[3]}));
const T=[['AI per imaging e diagnosi assistita','AI / Imaging',92,87,46,83,'COMPARE','Scaling','Caso d’uso chiaro su efficienza e comunicazione clinica.',['software regolati','integrazioni imaging','vendor in crescita']],['Chairside 3D printing','Digital dentistry',86,84,58,82,'EXPLORE','Scaling','Hardware e materiali stanno riducendo le barriere.',['hardware più veloce','materiali','workflow chairside']],['Robotic implant placement','Implantologia',78,76,84,72,'WATCH','Emerging','Segnale interessante ma barriere di costo e training.',['paper','centri avanzati','capex elevato']],['Remote orthodontic monitoring','Ortodontia',80,74,42,79,'EXPLORE','Adoption','Potenziale su capacità e retention.',['telemonitoraggio','riduzione visite','subscription']]].map(x=>({n:x[0],c:x[1],m:x[2],e:x[3],g:x[4],r:x[5],a:x[6],s:x[7],w:x[8],sig:x[9]}));
const S=[['Ministero della Salute','Official','OFFICIAL_OPEN','active','https://www.salute.gov.it/'],['Gazzetta Ufficiale','Official','RSS_ALLOWED','active','https://www.gazzettaufficiale.it/'],['FDA openFDA','Official API','API_ALLOWED','active','https://open.fda.gov/'],['PubMed','Scientific','API_ALLOWED','active','https://pubmed.ncbi.nlm.nih.gov/'],['EUDAMED','Official EU','OFFICIAL_OPEN','watch','https://ec.europa.eu/tools/eudamed/'],['UNIDI','Industry','TITLE_LINK_ONLY','active','https://www.unidi.it/'],['Expodental','Event','TITLE_LINK_ONLY','active','https://www.expodental.it/'],['AEEDC Dubai','Event','TITLE_LINK_ONLY','active','https://aeedc.com/']].map(x=>({n:x[0],t:x[1],r:x[2],s:x[3],url:x[4]}));
const pages=[['today','Oggi'],['products','Prodotti'],['compare','Confronta'],['quote','Preventivo'],['grants','Bandi'],['events','Eventi & ECM'],['world','World Radar'],['safety','Safety'],['ask','Ask Radar'],['admin','Admin']];
let st={page:'today',cmp:JSON.parse(localStorage.getItem('cmp')||'[]'),watch:JSON.parse(localStorage.getItem('watch')||'[]'),sources:JSON.parse(localStorage.getItem('src')||'null')||S};
const $=s=>document.querySelector(s),eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
function top(t,s=''){return '<div class="top"><div><h1>'+t+'</h1><div class="muted">'+s+'</div></div><div class="live">● MVP live</div></div>'}
function toast(s){let x=$('#toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',1700)}
function nav(){$('#nav').innerHTML=pages.map(x=>'<button class="'+(st.page==x[0]?'on':'')+'" onclick="st.page=\''+x[0]+'\';render()">'+x[1]+'</button>').join('')}
function tr(t){return '<div class="card radar"><div><span class="badge good">'+t.s+'</span><h3>'+t.n+'</h3><div class="muted">'+t.c+'</div><p>'+t.w+'</p>'+t.sig.map(s=>'<span class="sig">'+s+'</span>').join('')+'<p><b>Azione: '+t.a+'</b></p></div><div class="score"><small>Italy Readiness</small><b>'+t.r+'</b><div class="small">Momentum '+t.m+'<br>Evidence '+t.e+'<br>Italy Gap '+t.g+'</div></div></div>'}
function today(){return top('Il tuo studio oggi','Cosa sapere, comprare, controllare e osservare.')+'<div class="grid kpis"><div class="card kpi"><span class="muted">Prodotti</span><b>'+P.length+'</b></div><div class="card kpi"><span class="muted">Bandi</span><b>'+G.length+'</b></div><div class="card kpi"><span class="muted">Trend</span><b>'+T.length+'</b></div><div class="card kpi"><span class="muted">Watchlist</span><b>'+st.watch.length+'</b></div></div><div class="section"><h2>Priorità</h2><button class="btn" onclick="scan()">Aggiorna segnali</button></div><div class="list"><div class="row"><div><span class="badge red">LEGAL</span><b style="display:block;margin:6px 0">Norme e safety prima delle news</b><span class="muted">Fonte primaria sempre visibile.</span></div></div><div class="row"><div><span class="badge">MARKET</span><b style="display:block;margin:6px 0">TCO, non solo prezzo</b><span class="muted">Licenze, service, consumabili e training.</span></div></div><div class="row"><div><span class="badge good">MONEY</span><b style="display:block;margin:6px 0">Bando × acquisto</b><span class="muted">Collega incentivo e investimento.</span></div></div></div><div class="section"><h2>Italy Next</h2></div><div class="grid">'+T.slice(0,3).map(tr).join('')+'</div>'}
function pc(p){return '<div class="card product"><span class="badge good">'+p.cat+'</span><h3>'+p.name+'</h3><div class="muted">'+p.brand+'</div><div class="price">'+eur(p.p)+'</div><div class="small muted">Range '+eur(p.lo)+'–'+eur(p.hi)+' • TCO '+eur(p.tco)+'</div><p><button class="btn" onclick="cmp(\''+p.id+'\')">'+(st.cmp.includes(p.id)?'✓ Confronto':'Confronta')+'</button> <button class="btn" onclick="watch(\''+p.id+'\')">'+(st.watch.includes(p.id)?'★ Seguito':'☆ Segui')+'</button></p></div>'}
function products(){return top('Prodotti','Prezzi, range e TCO.')+'<div class="controls"><input class="input" id="ps" placeholder="Cerca..." oninput="filterP()"><select class="input" id="cat" onchange="filterP()"><option value="">Tutte</option><option>Scanner intraorale</option><option>Stampa 3D dentale</option><option>CBCT</option><option>Fresatore chairside</option></select></div><div class="grid products" id="plist">'+P.map(pc).join('')+'</div>'}
function filterP(){let s=$('#ps').value.toLowerCase(),c=$('#cat').value;$('#plist').innerHTML=P.filter(p=>(!s||(p.name+' '+p.brand).toLowerCase().includes(s))&&(!c||p.cat==c)).map(pc).join('')}
function cmp(id){st.cmp=st.cmp.includes(id)?st.cmp.filter(x=>x!=id):st.cmp.concat(id).slice(-3);localStorage.setItem('cmp',JSON.stringify(st.cmp));render()} function watch(id){st.watch=st.watch.includes(id)?st.watch.filter(x=>x!=id):st.watch.concat(id);localStorage.setItem('watch',JSON.stringify(st.watch));render()}
function compare(){let ps=st.cmp.map(id=>P.find(p=>p.id==id)).filter(Boolean);if(!ps.length)return top('Confronta','Seleziona fino a 3 prodotti.')+'<div class="card">Vai in Prodotti e premi Confronta.</div>';let rows=[['Prezzo','p'],['Min','lo'],['Max','hi'],['TCO 5 anni','tco'],['Radar score','score'],['Categoria','cat']];return top('Confronta','Prezzo e costo totale.')+'<div class="compare"><div class="label">Parametro</div>'+ps.map(p=>'<div><b>'+p.name+'</b></div>').join('')+rows.map(r=>'<div class="label">'+r[0]+'</div>'+ps.map(p=>'<div>'+(['p','lo','hi','tco'].includes(r[1])?eur(p[r[1]]):p[r[1]])+'</div>').join('')).join('')+'</div>'}
function quote(){return top('Analizza preventivo','Incolla un preventivo: il motore cerca prodotti e range.')+'<div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><textarea id="qt" placeholder="Es. Medit i700 €8.900..."></textarea><p><button class="btn dark" onclick="anQ()">Analizza</button></p></div><div class="card" id="qr"><b>Risultato</b><p class="muted">Nessuna analisi.</p></div></div>'}
function anQ(){let t=$('#qt').value.toLowerCase(),nums=(t.match(/[0-9][0-9\.]{2,}/g)||[]).map(x=>Number(x.replace(/\./g,''))).filter(x=>x>100),m=P.filter(p=>t.includes(p.name.toLowerCase())||t.includes(p.brand.toLowerCase())),save=0;m.forEach(p=>{let n=nums.find(x=>x>p.lo*.5&&x<p.hi*2)||p.p;save+=Math.max(0,n-p.lo)});$('#qr').innerHTML='<b>Analisi completata</b><p>Prodotti collegati: '+m.length+'</p>'+m.map(p=>'<div class="row"><div><b>'+p.name+'</b><div class="small muted">Range '+eur(p.lo)+'–'+eur(p.hi)+' • TCO '+eur(p.tco)+'</div></div></div>').join('')+'<p>Saving indicativo vs fascia bassa: <b>'+eur(save)+'</b></p><small class="muted">Verificare IVA, configurazione, bundle e garanzia.</small>'}
function grants(){return top('Bandi & Money Radar','Match rapido con l’investimento.')+'<div class="controls"><select id="gt" class="input"><option>Studio esistente</option><option>Primo studio</option><option>Nuova impresa</option></select><button class="btn primary" onclick="matchG()">Calcola match</button></div><div id="gl" class="list">'+G.map(gr).join('')+'</div>'} function gr(g){return '<div class="row"><div><span class="badge good">MATCH '+g.f+'%</span><b style="display:block;margin:6px 0">'+g.t+'</b><div class="muted">'+g.a+' • '+g.tags+'</div></div><a class="btn" target="_blank" href="'+g.url+'">Fonte</a></div>'} function matchG(){if($('#gt').value=='Primo studio')G[0].f=97;$('#gl').innerHTML=G.map(gr).join('');toast('Match aggiornato')}
function events(){return top('Eventi & ECM','Fiere e formazione.')+'<div class="list">'+E.map(e=>'<div class="row"><div><span class="badge">EVENT</span><b style="display:block;margin:6px 0">'+e.t+'</b><div class="muted">'+e.d+' • '+e.p+'</div></div><a class="btn" target="_blank" href="'+e.url+'">Apri</a></div>').join('')+'</div>'}
function world(){return top('World Radar → Italy Next','Segnali internazionali, evidence e Italy Gap.')+'<div class="grid">'+T.sort((a,b)=>b.r-a.r).map(tr).join('')+'</div>'}
function safety(){return top('Safety Watch','Ricerca live nei recall FDA.')+'<div class="card"><div class="controls"><input id="sq" class="input" value="dental"><button class="btn primary" onclick="fda()">Cerca live FDA</button></div><div id="sr" class="muted">Premi Cerca live FDA.</div></div>'}
async function fda(){let term=$('#sq').value||'dental';$('#sr').innerHTML='Ricerca…';try{let r=await fetch('https://api.fda.gov/device/recall.json?search='+encodeURIComponent('product_description:'+term)+'&limit=10'),j=await r.json();if(!r.ok)throw Error('API non disponibile');$('#sr').innerHTML=(j.results||[]).map(x=>'<div class="row"><div><span class="badge red">'+(x.status||'Recall')+'</span><b style="display:block;margin:6px 0">'+(x.product_description||'Dispositivo')+'</b><div class="small muted">'+(x.reason_for_recall||'')+'</div></div></div>').join('')||'Nessun risultato'}catch(e){$('#sr').innerHTML='Fonte live non disponibile dal browser: '+e.message}}
function ask(){return top('Ask Radar','Motore decisionale locale: zero token AI.')+'<div class="ask"><div class="card"><div id="chat"><div class="msg">Prova “scanner sotto 10000”, “bando attrezzature”, “trend AI”, “eventi”.</div></div><div class="controls"><input id="aq" class="input" style="flex:1"><button class="btn primary" onclick="askQ()">Chiedi</button></div></div><div class="card"><b>Query rapide</b><p><button class="btn" onclick="preset(\'scanner sotto 10000\')">Scanner &lt; €10k</button></p><p><button class="btn" onclick="preset(\'bando attrezzature\')">Bandi</button></p><p><button class="btn" onclick="preset(\'trend AI\')">Trend AI</button></p></div></div>'} function preset(x){$('#aq').value=x;askQ()} function askQ(){let x=$('#aq').value.toLowerCase(),a='';if(x.includes('scanner')){let m=x.match(/\d{4,6}/),max=m?Number(m[0]):1e9,ps=P.filter(p=>p.cat.includes('Scanner')&&p.p<=max);a=ps.map(p=>p.name+' '+eur(p.p)+' (TCO '+eur(p.tco)+')').join('; ')||'Nessuno nel catalogo MVP.'}else if(x.includes('bando')||x.includes('incent'))a=G.map(g=>g.t+' — '+g.a).join('; ');else if(x.includes('trend')||x.includes('ai'))a=T.filter(t=>!x.includes('ai')||t.n.toLowerCase().includes('ai')).map(t=>t.n+': '+t.r+'/100 '+t.a).join('; ');else if(x.includes('event')||x.includes('ecm'))a=E.map(e=>e.t+' — '+e.p).join('; ');else a='Posso interrogare prodotti, bandi, eventi, trend e safety.';$('#chat').innerHTML+='<div class="msg me">'+x+'</div><div class="msg">'+a+'</div>';$('#aq').value=''}
function admin(){return top('Admin & Fonti','Registry, rights e pipeline.')+'<div class="controls"><button class="btn primary" onclick="scan()">Run intelligence scan</button><button class="btn" onclick="resetS()">Reset</button></div><table><tr><th>Fonte</th><th>Tipo</th><th>Rights</th><th>Status</th><th></th></tr>'+st.sources.map((s,i)=>'<tr><td><a target="_blank" href="'+s.url+'">'+s.n+'</a></td><td>'+s.t+'</td><td>'+s.r+'</td><td>'+s.s+'</td><td><button class="btn" onclick="togS('+i+')">'+(s.s=='active'?'Pausa':'Attiva')+'</button></td></tr>').join('')+'</table><div class="section"><h2>Agent pipeline</h2></div><div class="card"><code>Source Scout → Change Detector → Fetch/Parse → Entity Resolver → Evidence Validator → Signal Scientist → Trend Scientist → Opportunity Analyst → Publisher → QA</code><p id="scanlog" class="muted small">Nessuna scansione.</p></div>'} function togS(i){st.sources[i].s=st.sources[i].s=='active'?'paused':'active';localStorage.setItem('src',JSON.stringify(st.sources));render()} function resetS(){localStorage.removeItem('src');st.sources=S.map(x=>({...x}));render()} function scan(){let e=$('#scanlog');if(e)e.textContent=new Date().toLocaleTimeString('it-IT')+' • READY • '+st.sources.filter(s=>s.s=='active').length+' fonti attive • delta engine MVP';toast('Pipeline operativa')}
function render(){nav();let m={today,products,compare,quote,grants,events,world,safety,ask,admin};$('#view').innerHTML=(m[st.page]||today)()}render();
</script></body></html>
